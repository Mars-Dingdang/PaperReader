name: Add release version consistency regression test

on:
  push:
    branches:
      - fix/latex-compiler-detection-v2.1.2

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add version consistency regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_release_compatibility.py')
          text = path.read_text(encoding='utf-8')
          if not text.startswith('import uuid\n'):
              raise SystemExit('unexpected import header')
          text = text.replace('import uuid\nfrom io import BytesIO\n', 'import json\nimport uuid\nfrom io import BytesIO\nfrom pathlib import Path\n', 1)
          anchor = "def test_desktop_health_version():\n    with TestClient(app) as client:\n        assert client.get('/health').json() == {'status': 'ok', 'app': 'PaperReader', 'version': '2.1.2'}\n\n\n"
          if anchor not in text:
              raise SystemExit('health version test anchor not found')
          addition = '''def test_release_version_metadata_stays_in_sync():\n    root = Path(__file__).resolve().parents[2]\n    package = json.loads((root / 'frontend' / 'package.json').read_text(encoding='utf-8'))\n    lock = json.loads((root / 'frontend' / 'package-lock.json').read_text(encoding='utf-8'))\n\n    assert package['version'] == app.version\n    assert lock['version'] == package['version']\n    assert lock['packages']['']['version'] == package['version']\n\n\n'''
          path.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY
      - name: Commit product test and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-v2.1.2-version-test.yml
          git add backend/tests/test_release_compatibility.py
          git commit -m 'test: guard release version metadata consistency'
          git push origin HEAD:fix/latex-compiler-detection-v2.1.2
