name: Sync v2.1.2 lockfile metadata

on:
  push:
    branches:
      - fix/latex-compiler-detection-v2.1.2

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync package-lock root version only
        working-directory: frontend
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!lock.packages || !lock.packages['']) {
            throw new Error('package-lock.json is missing packages[""]');
          }
          lock.version = '2.1.2';
          lock.packages[''].version = '2.1.2';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE

      - name: Verify dependency graph was not changed
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          current = json.loads(Path('frontend/package-lock.json').read_text(encoding='utf-8'))
          before_text = subprocess.check_output(
              ['git', 'show', 'HEAD^:frontend/package-lock.json'], text=True
          )
          before = json.loads(before_text)
          assert current['version'] == '2.1.2'
          assert current['packages']['']['version'] == '2.1.2'
          before['version'] = '2.1.2'
          before['packages']['']['version'] = '2.1.2'
          assert current == before, 'lockfile dependency graph changed unexpectedly'
          PY

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: sync frontend lockfile version to 2.1.2'
          git push origin HEAD:fix/latex-compiler-detection-v2.1.2
